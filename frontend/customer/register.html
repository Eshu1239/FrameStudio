<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FrameStudio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="auth-card p-4 p-md-5" style="max-width: 460px; width: 100%;">
        <div class="text-center mb-4">
            <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-white mb-2">
                <span class="p-2 rounded-3" style="background: linear-gradient(135deg, #6366f1, #06b6d4);">
                    <i class="fas fa-store text-white"></i>
                </span>
                <span class="fs-4 fw-bold brand-font">Frame<span style="color:#06b6d4">Studio</span></span>
            </a>
            <p class="text-light small mb-0" style="opacity: 0.8;">Join the creator commerce ecosystem</p>
        </div>

        <div id="regAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label form-label-high text-white">Full Name / Brand Name</label>
                <input type="text" id="regName" class="form-control form-control-luxury" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label class="form-label form-label-high text-white">Email Address</label>
                <input type="email" id="regEmail" class="form-control form-control-luxury" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label form-label-high text-white">Select Account Role</label>
                <select id="regRole" class="form-select form-control-luxury">
                    <option value="customer" selected>Customer / Art Collector</option>
                    <option value="vendor">Vendor / Agency / Creator (Requires Admin Approval)</option>
                </select>
                <div class="form-text text-light small opacity-75 mt-1">Vendor accounts require verification and Admin approval before logging in.</div>
            </div>

            <div class="mb-4">
                <label class="form-label form-label-high text-white">Password (Min 6 chars)</label>
                <input type="password" id="regPassword" class="form-control form-control-luxury" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" id="regSubmitBtn" class="btn btn-luxury w-100 py-3 fw-bold">
                <i class="fas fa-user-plus me-1"></i> Register Account
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="text-light small" style="opacity:0.8;">Already have an account? </span>
            <a href="login.html" class="small text-info text-decoration-none fw-bold">Sign In</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const API_ENDPOINT = (window.location.hostname.includes('render.com'))
            ? 'https://framestudio-backend.onrender.com/api'
            : 'http://localhost:5000/api';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('regAlert');
            const btn = document.getElementById('regSubmitBtn');

            alertBox.classList.add('d-none');
            alertBox.className = 'alert alert-danger py-2 px-3 small rounded-3';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';

            const full_name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const role = document.getElementById('regRole').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch(`${API_ENDPOINT}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, role, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    alertBox.className = 'alert alert-success py-2 px-3 small rounded-3';
                    alertBox.innerText = data.message || 'Registration successful! Redirecting to login...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    alertBox.innerText = data.message || 'Registration failed. Please try again.';
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus me-1"></i> Register Account';
                }
            } catch (err) {
                console.error('Registration Error:', err);
                alertBox.innerText = 'Unable to reach backend server. Please try again.';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus me-1"></i> Register Account';
            }
        });
    </script>
</body>
</html>
