<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisanal Catalog & Studio Offerings | FrameStudio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .category-chip {
            background: #0d1322;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50px;
            padding: 0.55rem 1.25rem;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .category-chip:hover, .category-chip.active {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #d946ef 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .product-card {
            background: #0d1322 !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #00f2fe !important;
        }
        .rating-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #facc15;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div id="flashcardContainer"></div>

    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top py-3">
        <div class="container">
            <button class="hamburger-btn me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#fsHamburgerDrawer">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center gap-2 text-white" href="index.html">
                <span class="p-2 rounded-3" style="background: linear-gradient(135deg, #6366f1, #06b6d4);">
                    <i class="fas fa-store text-white"></i>
                </span>
                <span class="fs-4 fw-bold brand-font">Frame<span style="color:#06b6d4">Studio</span></span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="shop.html" class="nav-link px-2 text-white fw-semibold active text-info">Catalog</a>
                <a href="orders.html" class="nav-link px-2 text-white fw-semibold">Orders</a>
                <a href="cart.html" class="btn btn-luxury-outline position-relative px-3 py-2">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
                </a>
                <ul class="navbar-nav" id="navAuthLinks"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <!-- Search & Filter Controls -->
        <div class="d-flex flex-column flex-md-row gap-3 justify-content-between align-items-center mb-4">
            <div class="input-group" style="max-width: 450px;">
                <span class="input-group-text bg-dark border-secondary text-info"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" class="form-control form-control-luxury" placeholder="Search creations, shoots, or frames..." oninput="handleSearch(this.value)">
            </div>
            <div class="d-flex gap-2">
                <select id="sortSelect" class="form-select form-control-luxury" style="width: 190px;" onchange="handleSort(this.value)">
                    <option value="newest">Newest Arrivals</option>
                    <option value="price_low">Price: Low to High</option>
                    <option value="price_high">Price: High to Low</option>
                </select>
            </div>
        </div>

        <!-- Category Filter Chips -->
        <div class="d-flex gap-2 overflow-x-auto pb-3 mb-4" id="categoryChips">
            <button class="category-chip active" onclick="filterCategory('')">All Offerings</button>
        </div>

        <!-- Products Grid -->
        <div class="row g-4" id="productsGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-info mb-3"></div>
                <div class="text-white fw-bold">Loading artisan catalog...</div>
            </div>
        </div>
    </div>

    <!-- Product Reviews Sheet Modal -->
    <div class="modal fade" id="productReviewsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content auth-card text-white border-0" style="background:#0d1322; border: 1px solid rgba(0,242,254,0.3) !important;">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold" id="prodReviewTitle"><i class="fas fa-star text-warning me-2"></i>Verified Reviews</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="prodReviewsBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/drawer.js"></script>
    <script>
        let currentCategory = '';
        let currentSearch = '';
        let currentSort = 'newest';
        let allProducts = [];

        function showFlashcard(message, type = 'success') {
            const container = document.getElementById('flashcardContainer');
            const card = document.createElement('div');
            card.className = `flashcard-toast ${type}`;
            card.innerHTML = `
                <div><i class="fas fa-check-circle text-success fs-5"></i></div>
                <div class="flex-grow-1">
                    <div class="fw-bold small text-uppercase" style="color:#34d399">Cart Updated</div>
                    <div class="small text-white mt-1">${message}</div>
                </div>
            `;
            container.appendChild(card);
            setTimeout(() => { card.style.opacity = '0'; setTimeout(() => card.remove(), 300); }, 3000);
        }

        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories`);
                const data = await res.json();
                if (data.success && data.data) {
                    const container = document.getElementById('categoryChips');
                    container.innerHTML = `<button class="category-chip ${currentCategory===''?'active':''}" onclick="filterCategory('')">All Offerings</button>` +
                        data.data.map(c => `
                            <button class="category-chip ${currentCategory===c.slug?'active':''}" onclick="filterCategory('${c.slug}')">
                                ${c.name}
                            </button>
                        `).join('');
                }
            } catch (err) { console.error(err); }
        }

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                const url = new URL(`${API_BASE}/products`);
                if (currentCategory) url.searchParams.set('category', currentCategory);
                if (currentSearch) url.searchParams.set('search', currentSearch);
                if (currentSort) url.searchParams.set('sort', currentSort);

                const res = await fetch(url);
                const data = await res.json();

                if (data.success && data.data && data.data.length > 0) {
                    allProducts = data.data;
                    grid.innerHTML = data.data.map(p => {
                        const rating = parseFloat(p.avg_rating || 5.0).toFixed(1);
                        const reviewsCnt = p.total_reviews || 0;

                        return `
                            <div class="col-lg-4 col-md-6">
                                <div class="product-card">
                                    <div class="product-img-wrap">
                                        <img src="${p.image_url}" alt="${p.name}">
                                    </div>
                                    <div class="p-4 d-flex flex-column flex-grow-1">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <span class="badge badge-luxury">${p.categories ? p.categories.name : 'Artisan'}</span>
                                            <div class="rating-badge cursor-pointer" onclick="viewProductReviews('${p.id}', '${p.name.replace(/'/g, "\\'")}')" title="View Customer Reviews">
                                                <i class="fas fa-star"></i> ${rating} <span class="text-light" style="opacity:0.8;">(${reviewsCnt})</span>
                                            </div>
                                        </div>
                                        <h5 class="fw-bold text-white mb-2">${p.name}</h5>
                                        <p class="text-light small flex-grow-1" style="opacity: 0.8; line-height: 1.5;">
                                            ${p.description ? p.description.slice(0, 95) + '...' : 'Handcrafted bespoke piece customized to order.'}
                                        </p>
                                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary mt-2">
                                            <div>
                                                <small class="text-light" style="opacity:0.75;">PRICE</small>
                                                <div class="fw-bold text-white fs-5">₹${parseFloat(p.price).toFixed(2)}</div>
                                            </div>
                                            <button onclick="addToCartAndNotify('${p.id}', '${p.name.replace(/'/g, "\\'")}', ${p.price}, '${p.image_url}')" class="btn btn-luxury btn-sm px-3 py-2">
                                                <i class="fas fa-bag-shopping me-1"></i> Add to Bag
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <div class="d-inline-flex p-4 rounded-circle mb-3" style="background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3);">
                                <i class="fas fa-palette fs-1 text-info"></i>
                            </div>
                            <h4 class="fw-bold text-white mb-2">No Matching Creations Found</h4>
                            <p class="text-light small">Try clearing your search query or selecting a different category chip.</p>
                        </div>
                    `;
                }
            } catch (err) {
                grid.innerHTML = `<div class="col-12 text-center text-danger py-4">Failed to load platform catalog.</div>`;
            }
        }

        function addToCartAndNotify(id, name, price, img) {
            Cart.add({ id, name, price, image_url: img }, 1);
            showFlashcard(`Added "${name}" to your shopping bag!`, 'success');
        }

        async function viewProductReviews(prodId, prodName) {
            document.getElementById('prodReviewTitle').innerHTML = `<i class="fas fa-star text-warning me-2"></i>Reviews for ${prodName}`;
            const body = document.getElementById('prodReviewsBody');
            body.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-info"></div></div>';
            new bootstrap.Modal(document.getElementById('productReviewsModal')).show();

            try {
                const res = await fetch(`${API_BASE}/products/${prodId}/reviews`);
                const data = await res.json();
                if (data.success && data.data && data.data.length > 0) {
                    body.innerHTML = data.data.map(r => `
                        <div class="p-3 rounded-3 mb-3 border border-secondary" style="background: rgba(255,255,255,0.02);">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <div class="d-flex align-items-center gap-2">
                                    <img src="${(r.profiles && r.profiles.avatar_url) || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;" alt="Avatar">
                                    <div>
                                        <div class="fw-bold text-white small">${(r.profiles && r.profiles.full_name) || 'Verified Client'}</div>
                                        <span class="badge bg-success" style="font-size:0.65rem;"><i class="fas fa-shield-check me-1"></i>Verified Buyer</span>
                                    </div>
                                </div>
                                <div class="text-warning small">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                            </div>
                            <p class="text-light small mb-0 mt-2" style="opacity:0.9; line-height:1.5;">${r.comment}</p>
                            <div class="text-muted" style="font-size:0.75rem; margin-top:6px;">${new Date(r.created_at).toLocaleDateString()}</div>
                        </div>
                    `).join('');
                } else {
                    body.innerHTML = `
                        <div class="text-center py-4 text-light" style="opacity:0.8;">
                            <i class="fas fa-comment-dots fs-2 text-info mb-2"></i>
                            <div>No customer reviews written for this listing yet. Be the first to order and review!</div>
                        </div>
                    `;
                }
            } catch (err) {
                body.innerHTML = '<div class="text-danger text-center">Failed to load reviews.</div>';
            }
        }

        function filterCategory(slug) {
            currentCategory = slug;
            loadCategories();
            loadProducts();
        }

        let searchTimeout = null;
        function handleSearch(val) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = val.trim();
                loadProducts();
            }, 300);
        }

        function handleSort(val) {
            currentSort = val;
            loadProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadProducts();
            const currentUser = Auth.getUser();
            if (typeof DrawerEngine !== 'undefined') {
                DrawerEngine.init(currentUser ? currentUser.role : 'customer');
            }
        });
    </script>
</body>
</html>
