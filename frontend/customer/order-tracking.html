<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | FrameStudio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .timeline-step {
            position: relative;
            padding-bottom: 2rem;
            padding-left: 2.5rem;
        }
        .timeline-step:last-child {
            padding-bottom: 0;
        }
        .timeline-step::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 24px;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .timeline-step:last-child::before {
            display: none;
        }
        .timeline-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
        }
        .timeline-step.completed .timeline-icon {
            background: #10b981;
            border-color: #10b981;
        }
        .timeline-step.active .timeline-icon {
            background: #6366f1;
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }
    </style>
</head>
<body>

    <!-- Sticky Glass Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-white" href="index.html">
                <span class="p-2 rounded-3" style="background: linear-gradient(135deg, #6366f1, #06b6d4);">
                    <i class="fas fa-store text-white"></i>
                </span>
                <span class="fs-4 fw-bold brand-font">Frame<span style="color:#06b6d4">Studio</span></span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="orders.html" class="nav-link px-2 text-white">My Orders</a>
                <a href="shop.html" class="btn btn-luxury-outline position-relative px-3 py-2">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
                </a>
                <ul class="navbar-nav" id="navAuthLinks"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div id="trackingContainer">
            <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const user = Auth.checkAuth(true);
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        const STATUS_TAGLINES = {
            'Pending': 'Your order has been received and is awaiting seller confirmation.',
            'Confirmed': 'Your order has been confirmed! The studio is preparing your handcrafted items.',
            'Processing': 'Your custom pieces are currently being handcrafted in the studio.',
            'Shipped': 'Your order has been dispatched and is on its way to you.',
            'Out for Delivery': 'Your parcel is out for delivery today.',
            'Delivered': 'Your order has been successfully delivered. Enjoy your handcrafted creation!',
            'Cancelled': 'This order has been cancelled.'
        };

        async function loadTrackingDetails() {
            if (!orderId) {
                window.location.href = 'orders.html';
                return;
            }

            const container = document.getElementById('trackingContainer');

            try {
                const res = await fetch(`${API_BASE}/orders/${orderId}`, {
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });
                const data = await res.json();

                if (data.success && data.data) {
                    const o = data.data;
                    const items = o.order_items || [];
                    const shipping = (o.shipping && o.shipping[0]) || {};
                    const addr = o.shipping_address || {};

                    const statuses = ['Pending', 'Confirmed', 'Processing', 'Shipped', 'Delivered'];
                    const currentIdx = statuses.indexOf(o.order_status);
                    const currentTagline = STATUS_TAGLINES[o.order_status] || 'Your order is progressing smoothly.';

                    container.innerHTML = `
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                            <div>
                                <span class="badge badge-luxury mb-2">Order Tracking</span>
                                <h2 class="fw-bold text-white mb-1">${o.order_number}</h2>
                                <p class="text-info small mb-0"><i class="fas fa-circle-info me-1"></i>${currentTagline}</p>
                            </div>
                            <a href="orders.html" class="btn btn-luxury-outline btn-sm mt-2 mt-md-0">
                                <i class="fas fa-arrow-left me-1"></i> Back to Orders
                            </a>
                        </div>

                        <div class="row g-4">
                            <!-- Live Progress Timeline -->
                            <div class="col-lg-6">
                                <div class="glass-card p-4 p-md-5 h-100">
                                    <h5 class="fw-bold text-white mb-4"><i class="fas fa-truck-fast text-primary me-2"></i>Fulfillment Timeline</h5>

                                    <div class="timeline">
                                        <div class="timeline-step ${currentIdx >= 0 ? (currentIdx === 0 ? 'active' : 'completed') : ''}">
                                            <div class="timeline-icon"><i class="fas fa-check"></i></div>
                                            <h6 class="fw-bold text-white mb-1">Order Placed</h6>
                                            <small class="text-muted">Payment: ${o.payment_method} (${o.payment_status})</small>
                                            <div class="small text-info mt-1" style="font-size:0.8rem;">Your order has been received and is awaiting seller confirmation.</div>
                                        </div>

                                        <div class="timeline-step ${currentIdx >= 1 ? (currentIdx === 1 ? 'active' : 'completed') : ''}">
                                            <div class="timeline-icon"><i class="fas fa-check"></i></div>
                                            <h6 class="fw-bold text-white mb-1">Payment & Order Confirmed</h6>
                                            <small class="text-muted">Verified and acknowledged by seller</small>
                                            <div class="small text-info mt-1" style="font-size:0.8rem;">Your order has been confirmed! The studio is preparing your handcrafted items.</div>
                                        </div>

                                        <div class="timeline-step ${currentIdx >= 2 ? (currentIdx === 2 ? 'active' : 'completed') : ''}">
                                            <div class="timeline-icon"><i class="fas fa-check"></i></div>
                                            <h6 class="fw-bold text-white mb-1">In Studio Production / Packaging</h6>
                                            <small class="text-muted">Custom handcrafted items/services prepared</small>
                                            <div class="small text-info mt-1" style="font-size:0.8rem;">Your custom pieces are currently being handcrafted in the studio.</div>
                                        </div>

                                        <div class="timeline-step ${currentIdx >= 3 ? (currentIdx === 3 ? 'active' : 'completed') : ''}">
                                            <div class="timeline-icon"><i class="fas fa-check"></i></div>
                                            <h6 class="fw-bold text-white mb-1">Dispatched / Shipped</h6>
                                            <small class="text-muted">
                                                ${shipping.courier_name ? `Via ${shipping.courier_name} (AWB: ${shipping.tracking_number || 'N/A'})` : 'Awaiting courier pickup'}
                                            </small>
                                            <div class="small text-info mt-1" style="font-size:0.8rem;">Your order has been dispatched and is on its way to you.</div>
                                        </div>

                                        <div class="timeline-step ${currentIdx >= 4 ? 'completed' : ''}">
                                            <div class="timeline-icon"><i class="fas fa-check"></i></div>
                                            <h6 class="fw-bold text-white mb-1">Delivered & Completed</h6>
                                            <small class="text-muted">Package successfully handed over</small>
                                            <div class="small text-info mt-1" style="font-size:0.8rem;">Your order has been successfully delivered. Enjoy your handcrafted creation!</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Order Summary & Shipping Address -->
                            <div class="col-lg-6">
                                <div class="glass-card p-4 p-md-5 mb-4">
                                    <h5 class="fw-bold text-white mb-3"><i class="fas fa-map-pin text-accent me-2"></i>Shipping Address</h5>
                                    <div class="text-light small">
                                        <div class="fw-bold fs-6 text-white">${addr.fullName || 'Customer'}</div>
                                        <div>${addr.street || ''}</div>
                                        <div>${addr.city || ''}, ${addr.state || ''} - ${addr.pincode || ''}</div>
                                        <div class="text-muted mt-2"><i class="fas fa-phone me-1"></i> ${addr.phone || 'N/A'}</div>
                                    </div>
                                </div>

                                <div class="glass-card p-4 p-md-5">
                                    <h5 class="fw-bold text-white mb-3">Itemized Breakdown</h5>
                                    ${items.map(i => `
                                        <div class="d-flex justify-content-between align-items-center py-2 border-bottom" style="border-color: var(--border-glass) !important;">
                                            <div>
                                                <span class="text-white fw-semibold small">${i.product_name}</span>
                                                <span class="text-muted small">x${i.quantity}</span>
                                            </div>
                                            <span class="text-white small fw-bold">₹${parseFloat(i.subtotal).toFixed(2)}</span>
                                        </div>
                                    `).join('')}

                                    <div class="d-flex justify-content-between mt-3 text-muted small">
                                        <span>Subtotal</span>
                                        <span class="text-white">₹${parseFloat(o.subtotal).toFixed(2)}</span>
                                    </div>
                                    <div class="d-flex justify-content-between text-muted small">
                                        <span>Shipping</span>
                                        <span class="text-white">₹${parseFloat(o.shipping_fee).toFixed(2)}</span>
                                    </div>
                                    <div class="d-flex justify-content-between text-success small">
                                        <span>Discount</span>
                                        <span class="text-white">-₹${parseFloat(o.discount).toFixed(2)}</span>
                                    </div>
                                    <div class="d-flex justify-content-between fs-5 fw-bold text-white pt-2 mt-2 border-top" style="border-color: var(--border-glass) !important;">
                                        <span>Total Amount</span>
                                        <span style="color: #06b6d4;">₹${parseFloat(o.total).toFixed(2)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="alert alert-danger">Order not found.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger">Error fetching order details.</div>`;
            }
        }

        loadTrackingDetails();
    </script>
</body>
</html>
