<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FrameStudio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="auth-card p-4 p-md-5" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-white mb-2">
                <span class="p-2 rounded-3" style="background: linear-gradient(135deg, #6366f1, #06b6d4);">
                    <i class="fas fa-store text-white"></i>
                </span>
                <span class="fs-4 fw-bold brand-font">Frame<span style="color:#06b6d4">Studio</span></span>
            </a>
            <p class="text-light small mb-0" style="opacity: 0.8;">Sign in to your account</p>
        </div>

        <div id="authAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label form-label-high text-white">Email Address</label>
                <input type="email" id="loginEmail" class="form-control form-control-luxury" placeholder="name@example.com" required>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label form-label-high text-white mb-0">Password</label>
                    <a href="#" class="small text-info text-decoration-none">Forgot password?</a>
                </div>
                <input type="password" id="loginPassword" class="form-control form-control-luxury mt-2" placeholder="••••••••" required>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-luxury w-100 py-3 fw-bold">
                <i class="fas fa-sign-in-alt me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="text-light small" style="opacity:0.8;">New to FrameStudio? </span>
            <a href="register.html" class="small text-info text-decoration-none fw-bold">Create Account</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const API_ENDPOINT = (window.location.hostname.includes('render.com'))
            ? 'https://framestudio-backend.onrender.com/api'
            : 'http://localhost:5000/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('authAlert');
            const btn = document.getElementById('loginSubmitBtn');

            if (alertBox) {
                alertBox.classList.add('d-none');
                alertBox.innerText = '';
            }
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing In...';
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_ENDPOINT}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('fs_user', JSON.stringify(data.user));
                    localStorage.setItem('fs_token', data.token);

                    if (data.user.role === 'admin' || data.user.role === 'vendor' || data.user.role === 'seller') {
                        window.location.href = '../admin/dashboard.html';
                    } else {
                        window.location.href = 'shop.html';
                    }
                } else {
                    if (alertBox) {
                        alertBox.innerText = data.message || 'Invalid email or password.';
                        alertBox.classList.remove('d-none');
                    }
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Sign In';
                    }
                }
            } catch (err) {
                console.error('Connection Error:', err);
                if (alertBox) {
                    alertBox.innerText = 'Unable to reach backend API. Please try again.';
                    alertBox.classList.remove('d-none');
                }
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Sign In';
                }
            }
        });
    </script>
</body>
</html>
